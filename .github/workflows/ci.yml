name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate · py${{ matrix.python }} (format · lint · types · tests, SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # ADR-0010: current and next CPython minors. A failure on either is a
      # blocking bug, not a reason to pin.
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cloudscale
          POSTGRES_PASSWORD: cloudscale
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudscale"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # PG-gated tests skip without this; CI must NOT skip them.
      CLOUDSCALE_TEST_PG: postgresql://cloudscale:cloudscale@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (hash-pinned)
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock
      - name: Gate
        run: make check
      - name: Assert PostgreSQL tests actually ran
        run: |
          .venv/bin/python -m pytest tests/unit/adapters/test_postgres_tier.py \
            tests/unit/adapters/test_postgres_command_uow.py -q -rs 2>&1 | tee pg.log
          ! grep -q "SKIPPED" pg.log

  dependency-audit:
    name: dependency vulnerabilities (pip-audit, production lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # lock age is read from git history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit the exact hash-pinned set that ships in the image
        # --strict: any resolution problem is a failure, not a skip.
        # Runs against requirements.lock (production), not the dev lock, so
        # a vulnerable test-only tool cannot block a release and a vulnerable
        # runtime dependency can never be hidden behind one.
        run: |
          python -m pip install --quiet pip-audit==2.9.0
          pip-audit -r requirements.lock --strict --disable-pip --progress-spinner off
      - name: Lock freshness (LONGEVITY §3 — quarterly refresh is enforced, not remembered)
        # Age = time since the lock file last changed in git. Dependabot PRs
        # only bump pyproject; the lock must be regenerated with the recorded
        # uv command, which is exactly the act this check forces each quarter.
        run: scripts/check_lock_age.sh requirements.lock requirements-dev.lock

  image:
    name: container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: cloudscale-backend:ci
      - name: Compose stack (PostgreSQL 17 · migrate · api · consumer, migrations mode)
        # The README's production-shaped quickstart, executed: schema comes
        # from Alembic only, the API must report ready, and a deposit must
        # round-trip through the consumer to the balance read model.
        run: |
          set -e
          docker compose up -d --wait --wait-timeout 120
          curl -sf http://127.0.0.1:8000/v1/ready
          python3 -m pip install --quiet pyjwt==2.13.0  # matches requirements.lock (ADR-0008)
          TOKEN=$(CLOUDSCALE_JWT_SECRET=local-dev-only-secret-0123456789abcdef-0123456789abcdef \
                  python3 scripts/dev_token.py --subject ci --minutes 5)
          curl -sf -X POST http://127.0.0.1:8000/v1/accounts/ci/commands \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"command_id\":\"$(uuidgen | tr A-Z a-z)\",\"type\":\"deposit\",\"amount\":42,\"expected_version\":0}" | tee cmd.json
          grep -q '"outcome":"accepted"' cmd.json
          sleep 1
          curl -sf http://127.0.0.1:8000/v1/accounts/ci/balance -H "Authorization: Bearer $TOKEN" | tee bal.json
          grep -q '"balance":42' bal.json
          docker compose logs --no-color migrate | tail -5
      - name: Compose diagnostics (on failure)
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=100 || true
      - name: Compose teardown
        if: always()
        run: docker compose down -v || true
      - name: Scan image (OS + Python packages; fails on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudscale-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Smoke (app factory constructs, fails closed without secret)
        run: |
          set -e
          # Must refuse to start without a JWT secret.
          if docker run --rm -e CLOUDSCALE_STORAGE=sqlite -e CLOUDSCALE_LOG_DB=/tmp/l.db \
               -e CLOUDSCALE_PROJECTION_DB=/tmp/p.db cloudscale-backend:ci \
               python -c "from cloudscale.entrypoints.http.main import build_app; build_app()"; then
            echo "expected startup to fail without CLOUDSCALE_JWT_SECRET"; exit 1
          fi
          # Must construct with one.
          docker run --rm -e CLOUDSCALE_STORAGE=sqlite -e CLOUDSCALE_LOG_DB=/tmp/l.db \
            -e CLOUDSCALE_PROJECTION_DB=/tmp/p.db \
            -e CLOUDSCALE_JWT_SECRET=ci-only-secret-0123456789abcdef-0123456789abcdef \
            cloudscale-backend:ci \
            python -c "from cloudscale.entrypoints.http.main import build_app; build_app(); print('ok')"

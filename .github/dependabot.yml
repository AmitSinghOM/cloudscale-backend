version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns: ["opentelemetry-*"]
    # Lock files are regenerated by `uv pip compile`; Dependabot PRs bump
    # pyproject.toml and CI's --require-hashes install fails until the lock
    # is regenerated, which is the intended reminder.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
